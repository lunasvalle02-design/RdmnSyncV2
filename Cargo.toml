[workspace]
members = [".", "crates/rdmnsync-core"]
default-members = [".", "crates/rdmnsync-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[package]
name = "rdmnsync"
description = "Mapeador de imputaciones entre instancias de Redmine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rdmnsync-core = { path = "crates/rdmnsync-core" }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "clipboard", "links"] }
egui_extras = { version = "0.37", default-features = false }
egui-phosphor = "0.14"
serde_json.workspace = true
chrono.workspace = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
